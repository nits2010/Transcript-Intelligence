[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-intelligence"
version = "0.1.0"
description = "AegisCloud Transcript Intelligence — meeting analytics pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.18",
    "kaleido>=0.2",
    "jupyter>=1.0",
    "nbformat>=5.9",
]

[project.scripts]
transcript-intelligence = "transcript_intelligence.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
