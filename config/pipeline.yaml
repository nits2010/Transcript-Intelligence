# Transcript Intelligence — Pipeline Configuration
# All thresholds, weights, colors, and taxonomy keywords live here.
# Edit this file to tune the pipeline without touching Python code.

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO         # DEBUG | INFO | WARNING | ERROR
  format: text        # text (human-readable) | json (structured, for log aggregators)
  file: null          # null = console only; or a path e.g. "logs/pipeline.log"
  max_bytes: 10485760 # 10 MB per file before rotation (only used when file is set)
  backup_count: 3     # number of rotated files to keep

# ---------------------------------------------------------------------------
# Domain
# ---------------------------------------------------------------------------
aegis_domain: "@aegiscloud.com"

# ---------------------------------------------------------------------------
# Talk time — Aegis talk fraction above which a meeting is flagged
# ---------------------------------------------------------------------------
support_talk_threshold: 0.65
external_talk_threshold: 0.60

# ---------------------------------------------------------------------------
# Action item follow-up detection
# ---------------------------------------------------------------------------
followup_window_days: 7

# ---------------------------------------------------------------------------
# Customer trajectory
# ---------------------------------------------------------------------------
min_trajectory_meetings: 3
trend_delta: 0.30  # ±delta from first-half avg triggers improving/declining

# ---------------------------------------------------------------------------
# Churn risk weights
# ---------------------------------------------------------------------------
churn_weights:
  churn_signal: 3.0
  negative_meeting: 2.0
  technical_issue: 1.5
  billing_dispute: 2.0
  support_escalation: 1.0
  sentiment_adjustment: 2.0  # subtracted: higher sentiment = lower risk

# ---------------------------------------------------------------------------
# Churn risk tier thresholds
# ---------------------------------------------------------------------------
churn_tiers:
  high: 10.0
  medium: 5.0

# ---------------------------------------------------------------------------
# Chart colors
# ---------------------------------------------------------------------------
call_type_colors:
  customer_support: "#EF553B"
  internal: "#636EFA"
  external: "#00CC96"

tier_colors:
  HIGH: "#EF553B"
  MEDIUM: "#FFA15A"
  LOW: "#00CC96"

trend_colors:
  improving: "#00CC96"
  stable: "#636EFA"
  declining: "#EF553B"

# ---------------------------------------------------------------------------
# Sentiment label ordering (worst to best — used for chart axis ordering)
# ---------------------------------------------------------------------------
sentiment_label_order:
  - very-negative
  - negative
  - mixed-negative
  - mixed-positive
  - positive
  - very-positive

